events {
    worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
  #   # UNCOMMENT THIS BLOCK LATER TO FORCE HTTPS REDIRECTS
  #   server_name localhost # replace with actual domain;;
  #   return 301 https://$host$request_uri;
  # }

  # server {
  #   listen 443 ssl;
  #   server_name localhost # replace with actual domain;

  #   # SSL Certificate Provisioning File Paths
  #   ssl_certificate         /etc/nginx/ssl/live/localhost;
  #   ssl_certificate_key     /etc/nginx/ssl/live/localhost;

  #   # Modern Secure Protocols & Cipher Optimizations (Mozilla Intermediate Profile)
  #   ssl_protocols           TLSv1.2 TLSv1.3;
  #   ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES246-GCM-SHA384:ECDHE-RSA-AES246-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES246-GCM-SHA384;
  #   ssl_prefer_server_ciphers off;
  #   ssl_session_cache       shared:SSL:10m;
  #   ssl_session_timeout     1d;
  
  #   # HSTS Header (Enforces HTTPS for 5 minutes, includes all subdomains)
  #   # Ramp up max-age as app is tested over https 5 min -> 1 week -> 1 month -> 1 year
  #   add_header Strict-Transport-Security "max-age=300; includeSubDomains; preload" always;

    # 1. Route API requests to the Backend
    location /api/ {
      # proxy pass from /api/* -> http://backend:8080/api/*
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # proxy_set_header X-Forwarded-Proto https; 
    }

    # 2. Route WebSocket requests to the Backend
    location /ws {
      proxy_pass http://backend:8080/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # proxy_set_header X-Forwarded-Proto https;
      
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # 3. Route everything else to the Frontend
    location / {
      proxy_pass http://frontend:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # proxy_set_header X-Forwarded-Proto https;
      proxy_redirect off;
    }
  }
}
